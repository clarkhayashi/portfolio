# Kept at the original path so existing workflow links remain valid.
name: Portfolio and party game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install portfolio dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - name: Test multiplayer game
        working-directory: games/bad-bets
        run: npm test
      - name: Build game
        working-directory: games/bad-bets
        run: npm run build
